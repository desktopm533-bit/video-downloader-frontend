<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Video Downloader</title>
  <meta name="theme-color" content="#0a0b12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b12;
    --panel: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.09);
    --text: #eef0f6;
    --text-dim: #8b8fa3;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --pink: #ec4899;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient glow blobs in background */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .glow.one { width: 380px; height: 380px; background: var(--violet); top: -120px; left: -100px; animation: float1 12s ease-in-out infinite; }
  .glow.two { width: 320px; height: 320px; background: var(--cyan); bottom: -100px; right: -80px; animation: float2 14s ease-in-out infinite; }
  .glow.three { width: 260px; height: 260px; background: var(--pink); top: 40%; right: 10%; opacity: 0.18; animation: float1 16s ease-in-out infinite reverse; }

  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px, 30px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px, -40px); } }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 540px; }

  header { text-align: center; margin-bottom: 30px; }
  header .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(139,92,246,0.12);
    border: 1px solid rgba(139,92,246,0.3);
    font-size: 11.5px;
    color: #c4b5fd;
    font-weight: 600;
    letter-spacing: 0.4px;
    margin-bottom: 16px;
  }
  header .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  header h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.4px;
    background: linear-gradient(120deg, #fff 30%, #c4b5fd 70%, var(--cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  header p { color: var(--text-dim); font-size: 14px; }
  header p b { color: var(--text); font-weight: 600; }

  .card {
    background: var(--panel);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .search {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .input-shell {
    flex: 1 1 220px;
    min-width: 0;
    position: relative;
  }
  input[type="text"] {
    width: 100%;
    padding: 15px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input[type="text"]:focus {
    border-color: var(--violet);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
  }
  input[type="text"]::placeholder { color: #5c5f6f; }

  button#fetchBtn {
    flex: 1 1 100%;
    padding: 15px 22px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(139,92,246,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button#fetchBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139,92,246,0.5); }
  button#fetchBtn:active { transform: translateY(0); }
  button#fetchBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  @media (min-width: 460px) {
    button#fetchBtn { flex: 0 0 auto; }
  }

  .status-line {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 16px;
  }
  .status-line.error { color: #f87171; }
  .status-line.success { color: #4ade80; }

  .loading {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 16px 0 4px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .loading.show { display: flex; }
  .pulse-ring {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid var(--violet);
    border-top-color: var(--cyan);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { display: none; margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--border); }
  .result.show { display: block; }

  .video-info { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .video-info .thumb-wrap {
    position: relative;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .video-info img { width: 100px; height: 68px; object-fit: cover; display: block; }
  .video-info h3 {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .video-info .plat-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 7px;
    font-size: 11px;
    font-weight: 600;
    color: var(--cyan);
    background: rgba(34,211,238,0.1);
    border: 1px solid rgba(34,211,238,0.25);
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: capitalize;
  }

  .qualities-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 10px;
  }

  .qualities { display: flex; flex-direction: column; gap: 8px; }
  .quality-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  .quality-row:hover {
    border-color: var(--violet);
    background: rgba(139,92,246,0.08);
    transform: translateX(2px);
  }
  .quality-row .q-left { display: flex; align-items: center; gap: 10px; }
  .quality-row .q-label { font-size: 13.5px; font-weight: 700; font-family: 'Sora', sans-serif; }
  .quality-row .q-size { font-size: 11.5px; color: var(--text-dim); }
  .quality-row .q-download {
    font-size: 12px;
    font-weight: 700;
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  footer { text-align: center; margin-top: 22px; }
  footer .disclaimer { font-size: 11.5px; color: var(--text-dim); margin-bottom: 8px; }
  footer .credits {
    font-size: 12px;
    color: #5c5f6f;
    font-family: 'Sora', sans-serif;
    letter-spacing: 0.3px;
  }
  footer .credits b {
    background: linear-gradient(120deg, var(--violet), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>

<div class="wrap">
  <header>
    <span class="badge"><span class="dot"></span> HD · No Watermark</span>
    <h1>All Video Downloader</h1>
    <p>Instagram <b>·</b> TikTok video downloader</p>
  </header>

  <div class="card">
    <div class="search">
      <div class="input-shell">
        <input type="text" id="videoUrl" placeholder="Paste video link here..." />
      </div>
      <button id="fetchBtn">Fetch Video</button>
    </div>

    <div class="loading" id="loading">
      <span class="pulse-ring"></span>
      <span>Fetching video details...</span>
    </div>

    <div class="status-line" id="status"></div>

    <div class="result" id="result">
      <div class="video-info">
        <div class="thumb-wrap"><img id="thumb" src="" alt="thumbnail" /></div>
        <div class="meta">
          <h3 id="videoTitle"></h3>
          <span class="plat-tag" id="platTag"></span>
        </div>
      </div>
      <div class="qualities-label">Choose Quality</div>
      <div class="qualities" id="qualities"></div>
    </div>
  </div>

  <footer>
    <div class="disclaimer">Sirf public videos ke liye — personal use tak mehdood rakhein</div>
    <div class="credits">Developed by <b>M Qamar</b></div>
  </footer>
</div>

<script>
  const BACKEND_URL = "https://video-downloader-rfpe.onrender.com";

  const fetchBtn = document.getElementById("fetchBtn");
  const urlInput = document.getElementById("videoUrl");
  const statusEl = document.getElementById("status");
  const loadingEl = document.getElementById("loading");
  const resultEl = document.getElementById("result");
  const qualitiesEl = document.getElementById("qualities");

  fetchBtn.addEventListener("click", fetchVideoInfo);
  urlInput.addEventListener("keypress", (e) => { if (e.key === "Enter") fetchVideoInfo(); });

  function detectPlatform(url) {
    url = url.toLowerCase();
    if (url.includes("instagram.com")) return "Instagram";
    if (url.includes("tiktok.com")) return "TikTok";
    return null;
  }

  async function fetchVideoInfo() {
    const url = urlInput.value.trim();
    if (!url) { showStatus("Pehle koi link paste karein", true); return; }

    resultEl.classList.remove("show");
    loadingEl.classList.add("show");
    showStatus("");
    fetchBtn.disabled = true;

    try {
      const res = await fetch(`${BACKEND_URL}/api/info`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Kuch ghalat ho gaya");

      document.getElementById("thumb").src = data.thumbnail || "";
      document.getElementById("videoTitle").innerText = data.title || "Untitled Video";
      document.getElementById("platTag").innerText = data.platform || detectPlatform(url) || "video";

      qualitiesEl.innerHTML = "";
      data.formats.forEach((f) => {
        const row = document.createElement("div");
        row.className = "quality-row";
        const sizeText = f.filesize ? `${(f.filesize / (1024 * 1024)).toFixed(1)} MB` : "";
        row.innerHTML = `
          <span class="q-left">
            <span class="q-label">${f.quality}</span>
            <span class="q-size">${sizeText}</span>
          </span>
          <span class="q-download">Download ↓</span>
        `;
        row.onclick = () => downloadVideo(url, f.format_id);
        qualitiesEl.appendChild(row);
      });

      resultEl.classList.add("show");
    } catch (err) {
      showStatus(err.message, true);
    } finally {
      loadingEl.classList.remove("show");
      fetchBtn.disabled = false;
    }
  }

  function downloadVideo(url, formatId) {
    pollDownload(url, formatId);
  }

  async function pollDownload(url, formatId) {
    showStatus("Queue mein daala ja raha hai...");
    try {
      const createRes = await fetch(`${BACKEND_URL}/api/jobs`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, format_id: formatId }),
      });
      const createData = await createRes.json();
      if (!createRes.ok) throw new Error(createData.detail || "Job shuru nahi ho saka");

      const jobId = createData.job_id;

      // Har 2 second mein status check karna jab tak "done" ya "failed" na ho
      const poll = async () => {
        const res = await fetch(`${BACKEND_URL}/api/jobs/${jobId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Status check fail");

        if (data.status === "queued") {
          showStatus("Aapki video queue mein hai, thodi der intezar karein...");
          setTimeout(poll, 2000);
        } else if (data.status === "processing") {
          showStatus("Video download ho rahi hai, please wait...");
          setTimeout(poll, 2000);
        } else if (data.status === "done") {
          showStatus("✓ Tayyar hai! Download shuru ho rahi hai...");
          const fileUrl = `${BACKEND_URL}/api/jobs/${jobId}/file`;
          const a = document.createElement("a");
          a.href = fileUrl;
          a.rel = "noopener";
          document.body.appendChild(a);
          a.click();
          a.remove();
        } else if (data.status === "failed") {
          showStatus(data.error || "Download fail ho gayi", true);
        }
      };

      poll();
    } catch (err) {
      showStatus(err.message, true);
    }
  }

  function showStatus(msg, isError = false) {
    statusEl.innerText = msg;
    statusEl.className = "status-line" + (isError ? " error" : "");
  }
</script>

</body>
</html>
